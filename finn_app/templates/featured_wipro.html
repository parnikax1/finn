<div id="featured-brief"{% if partial %} hx-swap-oob="true"{% endif %}>
{% if featured %}
  <section class="featured-filing" aria-labelledby="featured-heading">
    <p class="small-label">Featured walkthrough · WIPRO</p>
    <h2 id="featured-heading">{{ featured.title }}</h2>
    <p>{{ featured.appointment }} <a href="{{ event_url(featured.id, back, page=featured.pages[0].page, anchor='#source-evidence') }}">Read excerpt · PDF p. {{ featured.pages[0].page }}</a></p>
    <p>{{ featured.context }} <a href="{{ event_url(featured.id, back, page=featured.pages[1].page, anchor='#source-evidence') }}">Read excerpt · PDF p. {{ featured.pages[1].page }}</a></p>
    <nav class="featured-actions" aria-label="Wipro walkthrough actions">
      <a class="button" href="{{ event_url(featured.id, back) }}">Open Wipro brief</a>

    </nav>
  </section>
{% endif %}
</div>
