{% if featured %}
<div id="featured-brief">
  <section class="featured-filing" aria-labelledby="featured-heading">
    <p class="feature-kicker"><span></span> WIPRO <span class="feature-separator">/</span> Leadership</p>
    <h2 id="featured-heading">{{ featured.title }}</h2>
    <p class="feature-context">{{ featured.context }}</p>
    <p class="feature-effective">Effective <time datetime="2026-12-08">{{ featured.effective_date }}</time></p>
    <div class="featured-actions">
      <a class="button" href="{{ event_url(featured.id, back) }}">Read brief <span aria-hidden="true">→</span></a>
    </div>
    <div class="feature-sources" aria-label="Evidence for the lead story">
      {% for source in featured.pages %}
      <a href="{{ event_url(featured.id, back, page=source.page, anchor='#source-evidence') }}" aria-label="{{ source.label }} · PDF p. {{ source.page }}">Read excerpt · PDF p. {{ source.page }}</a>
      {% endfor %}
    </div>
  </section>
</div>
{% endif %}
